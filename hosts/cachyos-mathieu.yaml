# Host configuration for cachyos-mathieu
# Working Gaming Desktop
# Bootstrapped from BlackDon's configuration

host: cachyos-mathieu
description: Working Gaming Desktop

# Import shared configurations (optional)
# Example:
# import:
#   - hosts/shared/laptop-common.yaml

# Enabled modules
enabled_modules:
  - gaming/gaming-packages
  - gaming/controller-support
  - gaming/sunshine
  - login-managers/sddm-enable
  - niri
  - editors/helix-catppuccin-mocha
  - cli-tools
  - dev
  - package-mods/main-apps
  - rgb
  - video
  - media
  - 3d

# Host-specific packages
packages:
  - flatpak
  - snap-pac # Pacman hooks: snapshot transactions from dcli install/update too

# Exclude packages from base or modules
exclude: []

# Configuration backup settings
config_backups:
  enabled: true # Auto-backup on sync
  max_backups: 5 # Keep last 5 backups (0 = unlimited)

# System backup settings
system_backups:
  enabled: true # Global toggle for system backups
  backup_on_sync: true # Create backup during dcli sync
  backup_on_update: true # Create backup during dcli update
  tool: snapper # Backup tool: timeshift or snapper
  snapper_config: root # Snapper config name (if using snapper)

# Settings
flatpak_scope: user
auto_prune: false
editor: helix
aur_helper: paru
